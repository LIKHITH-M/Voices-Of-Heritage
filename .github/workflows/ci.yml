name: Voices of Heritage CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─────────────────────────────────────────
  # Lint & Type Check — Frontend
  # ─────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  # ─────────────────────────────────────────
  # Unit Tests — Frontend
  # ─────────────────────────────────────────
  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test

  # ─────────────────────────────────────────
  # Lint & Test — Node.js Backend Services
  # ─────────────────────────────────────────
  backend-node-test:
    name: Backend Node Services Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - dashboard-service
          - immersive-service
          - archives-service
          - smart-utilities
          - crowd-service
          - stay-service
          - artisan-service
          - conservation-service
          - food-service
          - wellness-service
          - school-service
          - activity-service
          - community-service
          - partnerships-service
    defaults:
      run:
        working-directory: backend/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then npm ci; fi
      - name: Run tests (if present)
        run: |
          if [ -f package.json ] && npm run | grep -q "test"; then npm test; fi

  # ─────────────────────────────────────────
  # Docker Build Verification
  # ─────────────────────────────────────────
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [frontend-test, backend-node-test]
    continue-on-error: true  # Docker build is optional for Vercel deploys
    steps:
      - uses: actions/checkout@v4
      - name: Copy env template
        run: cp .env.example .env
      - name: Build all images
        run: docker compose build --parallel

  # ─────────────────────────────────────────
  # Deploy to Staging (dev branch only)
  # ─────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging environment
        run: echo "🚀 Add your staging deployment steps here (k8s apply, SSH deploy, etc.)"
        # TODO: Add actual deployment steps once infrastructure is set up

  # ─────────────────────────────────────────
  # Deploy to Production (main branch only)
  # ─────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo "🚀 Add your production deployment steps here"
        # TODO: Add actual k8s production deployment
