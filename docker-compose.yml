services:
  # ─────────────────────────────────────────
  # Databases
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voices_heritage}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voh-network

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - voh-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voh-network

  # ─────────────────────────────────────────
  # Core Production Microservices
  # ─────────────────────────────────────────
  auth-service:
    build: ./backend/auth-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "4001:4001"
    depends_on:
      - postgres
      - redis
    networks:
      - voh-network

  ai-planner-service:
    build: ./backend/ai-planner-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "5002:5002"
    depends_on:
      - mongo
    networks:
      - voh-network

  research-service:
    build: ./backend/research-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "5003:5003"
    depends_on:
      - mongo
    networks:
      - voh-network

  # ─────────────────────────────────────────
  # Frontend Application
  # ─────────────────────────────────────────
  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - ai-planner-service
      - research-service
    networks:
      - voh-network

# ─────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  mongo_data:
  redis_data:

# ─────────────────────────────────────────
# Networks
# ─────────────────────────────────────────
networks:
  voh-network:
    driver: bridge
